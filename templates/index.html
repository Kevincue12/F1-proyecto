<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700;900&display=swap" rel="stylesheet">

    <style>

        body {
            margin: 0;
            font-family: "Montserrat", sans-serif;
            background: #0d0d0d;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 900px;
            padding: 20px;
            text-align: center;
        }

        .banner {
            width: 100%;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.4);
            animation: fadeIn 1.2s ease;
        }

        .banner img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            filter: brightness(85%);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-top: 25px;
            margin-bottom: 40px;
            animation: slideDown 1s ease;
        }

        .btn {
            width: 60%;
            padding: 15px;
            margin: 12px auto;
            font-size: 1.2rem;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            transition: 0.25s;
        }

        .btn-login {
            background: #e10600;
            border: none;
            color: white;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
        }

        .btn-login:hover {
            background: #ff2920;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.9);
            transform: scale(1.05);
        }

        .btn-register {
            background: #222;
            border: 2px solid #444;
            color: #ddd;
        }

        .btn-register:hover {
            border-color: #777;
            color: white;
            transform: scale(1.05);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>

<body>
    <div class="container">
        
        <div class="banner">
            <img src="/static/img/f1-banner.jpg" alt="Formula 1">
        </div>

        <h1>La gestión de F1 en tus manos</h1>

        <button class="btn btn-login" onclick="window.location.href='/login'">
            Iniciar Sesión
        </button>

        <button class="btn btn-register" onclick="window.location.href='/register'">
            Registrarse
        </button>

    </div>
</body>
</html>
