<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Editar Escudería - F1 Manager</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#09090b;
      --card:#111113;
      --muted:#9aa0a6;
      --accent:#e10600;
      --hover:rgba(255,255,255,0.07);
      --glass:rgba(255,255,255,0.03);
    }

    *{box-sizing:border-box;font-family:"Montserrat",sans-serif;}
    body{
      margin:0;
      background:linear-gradient(180deg,#050505 0%, #0b0b0c 100%);
      color:#eee;
      overflow-x:hidden;
    }

    .wrap{display:flex;min-height:100vh;}

    /* Sidebar */
    .sidebar{
      width:260px;background:#0c0c0d;padding:28px 20px;
      border-right:1px solid rgba(255,255,255,0.05);
      position:sticky;top:0;height:100vh;
    }
    .logo{display:flex;align-items:center;gap:12px;margin-bottom:26px;}
    .logo .dot{
      width:42px;height:42px;border-radius:10px;background:var(--accent);
      box-shadow:0 6px 20px rgba(225,6,0,0.25);
    }
    .logo h2{margin:0;font-size:1.05rem;font-weight:900;}

    .user{
      margin-top:18px;padding:14px;border-radius:12px;background:var(--glass);
      display:flex;gap:12px;align-items:center;
    }
    .user img{
      width:46px;height:46px;border-radius:50%;object-fit:cover;
      border:2px solid var(--accent);
    }

    nav{margin-top:26px;}
    nav a{
      display:block;padding:12px;border-radius:10px;
      color:#cfcfcf;text-decoration:none;margin-bottom:6px;
      transition:0.2s;
    }
    nav a:hover{background:var(--hover);color:#fff;}

    .logoutbtn{
      margin-top:20px;width:100%;padding:9px;
      background:transparent;border-radius:10px;border:1px solid rgba(255,255,255,0.15);
      color:#ddd;cursor:pointer;transition:.2s;font-size:.9rem;
    }
    .logoutbtn:hover{background:var(--hover);}

    /* MAIN */
    .main{flex:1;padding:32px;}
    .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}

    .btn{
      background:var(--accent);color:#fff;padding:10px 16px;border-radius:10px;
      border:0;font-weight:700;cursor:pointer;transition:.2s;
      box-shadow:0 4px 14px rgba(225,6,0,0.35);
    }
    .btn:hover{transform:scale(1.04);}

    .panel{
      background:var(--card);padding:26px;border-radius:14px;
      box-shadow:0 6px 20px rgba(0,0,0,0.45);
      max-width:600px;margin:auto;
    }

    input{
      width:100%;padding:12px;margin-bottom:14px;border-radius:10px;
      background:#0d0d0f;border:1px solid rgba(255,255,255,0.12);
      color:#fff;font-size:0.92rem;
    }

    label{
      display:block;margin-bottom:6px;color:var(--muted);
      font-size:.85rem;
    }

    .thumb{
      width:150px;height:100px;border-radius:10px;margin-bottom:16px;
      border:1px solid rgba(255,255,255,0.12);object-fit:cover;
    }
  </style>
</head>

<body>

<div class="wrap">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="logo">
      <div class="dot"></div>
      <h2>F1 Manager</h2>
    </div>

  <div class="user">
    <div style="
        width:46px;
        height:46px;
        border-radius:50%;
        border:2px solid var(--accent);
        background:var(--card);
        display:flex;
        align-items:center;
        justify-content:center;
        font-weight:900;
        font-size:1.2rem;
        color:#fff;
    ">
      {{ user.username[:1] | upper }}
    </div>

    <div>
      <strong>{{ user.username }}</strong><br>
      <span style="color:var(--muted);font-size:0.8rem">Administrador</span>
    </div>
  </div>


    <nav>
      <a href="/dashboard">🏁 Dashboard</a>
      <a href="/pilotos_page">👨‍✈️ Pilotos</a>
      <a href="/escuderias_page">🚗 Escuderías</a>
      <a href="/grandes_premios_page">🏆 Grandes Premios</a>
    </nav>

    <button class="logoutbtn" onclick="window.location.href='/logout'">Cerrar sesión</button>
  </aside>

  <!-- MAIN -->
  <main class="main">

    <div class="header">
      <div>
        <h1 style="margin:0;font-weight:900">Editar Escudería</h1>
        <div style="color:var(--muted);margin-top:4px;">
          Modifica los datos de la escudería seleccionada
        </div>
      </div>

      <button class="btn" onclick="window.location.href='/escuderias_page'">← Volver</button>
    </div>

    <section class="panel">

      <form action="/escuderias/{{ escuderia.id }}/editar" method="post" enctype="multipart/form-data">

        <label>Logo / Foto Actual</label>
        <img class="thumb" src="/foto/escuderia/{{ escuderia.id }}">

        <label>Subir nueva foto</label>
        <input type="file" name="foto" accept="image/*">

        <label>Nombre de la Escudería</label>
        <input name="nombre" value="{{ escuderia.nombre }}" required>

        <label>País</label>
        <input name="pais" value="{{ escuderia.pais }}" required>

        <label>Campeonatos de Constructores</label>
        <input name="campeonatos_constructores" type="number" min="0" value="{{ escuderia.campeonatos_constructores }}" required>

        <button class="btn" type="submit">Guardar Cambios</button>

      </form>

    </section>

  </main>

</div>

</body>
</html>
